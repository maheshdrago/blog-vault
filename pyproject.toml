[project]
name = "blog-vault-api"
version = "0.1.0"
description = "FastAPI and MCP backend for an HTML-first personal blog."
requires-python = ">=3.12"
dependencies = [
  "bleach>=6.2.0,<7",
  "alembic>=1.16.0,<2",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.0,<1",
  "langfuse>=4.0.0,<5",
  "mcp>=1.12.0,<2",
  "pydantic-settings>=2.10.0,<3",
  "psycopg[binary]>=3.2.0,<4",
  "sqlalchemy[asyncio]>=2.0.0,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<9",
  "ruff>=0.12.0,<1",
  "types-bleach>=6.2.0,<7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
