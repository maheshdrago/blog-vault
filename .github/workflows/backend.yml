name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/docker/api.Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - "infra/docker/api.Dockerfile"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend migrations
      - run: uv run mypy backend
      - run: uv run pytest

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
